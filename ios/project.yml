name: CaseRoom
options:
  bundleIdPrefix: study.mycase
  deploymentTarget:
    iOS: "17.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 150.0.0
targets:
  CaseRoom:
    type: application
    platform: iOS
    sources: [CaseRoom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: study.mycase
        ASSETCATALOG_COMPILER_APPICON_NAME: myCase
    entitlements:
      path: CaseRoom/Support/CaseRoom.entitlements
      properties:
        com.apple.security.application-groups: [group.study.mycase]
    info:
      path: CaseRoom/Support/Info.plist
      properties:
        API_BASE_URL: http://127.0.0.1:8077
        CFBundleDisplayName: myCase
        CFBundleURLTypes:
          - CFBundleURLName: study.mycase
            CFBundleURLSchemes: [caseroom]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Adds your accepted practice sessions to your calendar.
        NSCameraUsageDescription: >-
          Scans your practice partner's pairing QR code to join the session.
        NSMicrophoneUsageDescription: >-
          Records the room audio of your in-person practice session for
          later review.
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
    dependencies:
      - package: WebRTC
      - target: CaseRoomWidgets
  CaseRoomWidgets:
    type: app-extension
    platform: iOS
    sources: [CaseRoomWidgets, CaseRoom/LiveActivity, CaseRoom/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: study.mycase.widgets
    entitlements:
      path: CaseRoomWidgets/CaseRoomWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.study.mycase]
    info:
      path: CaseRoomWidgets/Info.plist
      properties:
        # ToggleFreeNowIntent runs in this extension's process when tapped on the
        # widget; Bundle.main is then the extension bundle, so it needs the same
        # API base URL + local-networking allowance the app target carries.
        API_BASE_URL: http://127.0.0.1:8077
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CaseRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaseRoomTests
        excludes:
          - "Fixtures/**"
      - path: CaseRoomTests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CaseRoom
      - package: WebRTC
