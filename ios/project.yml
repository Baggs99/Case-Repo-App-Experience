name: CaseRoom
options:
  bundleIdPrefix: studio.ogee
  deploymentTarget:
    iOS: "17.0"
targets:
  CaseRoom:
    type: application
    platform: iOS
    sources: [CaseRoom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.ogee.caseroom
    info:
      path: CaseRoom/Support/Info.plist
      properties:
        API_BASE_URL: http://127.0.0.1:8077
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Adds your accepted practice sessions to your calendar.
        NSCameraUsageDescription: >-
          Scans your practice partner's pairing QR code to join the session.
        NSMicrophoneUsageDescription: >-
          Records the room audio of your in-person practice session for
          later review.
        UIBackgroundModes: [remote-notification]
  CaseRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaseRoomTests
        excludes:
          - "Fixtures/**"
      - path: CaseRoomTests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CaseRoom
