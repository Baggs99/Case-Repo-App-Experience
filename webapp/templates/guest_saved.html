<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myCase — {% if boot.notNow or boot.isGuest %}Kept for now{% else %}On the record{% endif %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<style>
  :root{--green:#1B9A5F}
  body{margin:0;min-height:100vh;background:#F3F5F8;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes drawpath{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<svg width="480" height="400" viewBox="0 0 48 40" aria-hidden="true" style="position:absolute;top:120px;right:-200px;opacity:.4;pointer-events:none"><path d="M4 35 H15 V25 H26 V15 H37 V4 H45" fill="none" stroke="#C9D2DF" stroke-width="0.6"></path></svg>

<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 32px;position:relative;max-width:480px;margin:0 auto;width:100%;box-sizing:border-box">
  {% if boot.notNow or boot.isGuest %}
  <h1 style="margin:0 0 10px;font-weight:800;font-size:30px;letter-spacing:-0.035em;color:#0D1C31;animation:rise .42s cubic-bezier(0.22,1,0.36,1) .1s both">Kept for now.</h1>
  <p style="margin:0;font-family:'Source Serif 4',serif;font-size:14.5px;line-height:1.5;color:#515A66;max-width:270px;animation:rise .42s cubic-bezier(0.22,1,0.36,1) .25s both">This tab holds it until you close it — create an account any time to keep it for good.</p>
  {% else %}
  <svg width="104" height="87" viewBox="0 0 48 40" aria-hidden="true" style="margin-bottom:20px"><defs><linearGradient id="g26" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="4"><stop offset="0" stop-color="#0D1C31"></stop><stop offset="1" style="stop-color:var(--green)"></stop></linearGradient></defs><path d="M4 35 H15 V25 H26 V15 H37 V4 H45" fill="none" stroke="url(#g26)" stroke-width="4" stroke-dasharray="74" stroke-dashoffset="74" style="animation:drawpath .9s cubic-bezier(0.22,1,0.36,1) .1s forwards"></path></svg>
  <h1 style="margin:0 0 10px;font-weight:800;font-size:30px;letter-spacing:-0.035em;color:#0D1C31;animation:rise .42s cubic-bezier(0.22,1,0.36,1) .25s both">On the record.</h1>
  <p style="margin:0;font-family:'Source Serif 4',serif;font-size:14.5px;line-height:1.5;color:#515A66;max-width:270px;animation:rise .42s cubic-bezier(0.22,1,0.36,1) .4s both">Session one of your interviewer log. Onboarding picks up from here — school optional for interviewers.</p>
  {% endif %}
</div>
</body>
</html>
