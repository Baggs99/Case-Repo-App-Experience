{% extends "base.html" %}
{% block title %}Set a new password · myCase{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-14 animate-fade-up">
    <div class="surface rounded-2xl shadow-card p-7 sm:p-8">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-50 mb-1.5">Set a new password</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed">
            Pick a new password for your account. You'll be signed out of every device.
        </p>

        {% if error %}
        <div class="mb-4 px-3 py-2 rounded-lg bg-rose-50 border border-rose-200 text-sm text-rose-800
                    dark:bg-rose-500/10 dark:border-rose-500/20 dark:text-rose-300">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/reset-password" class="space-y-4">
            <input type="hidden" name="token" value="{{ token }}">

            <div>
                <label for="new_password" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5">New password</label>
                <input type="password" id="new_password" name="new_password" required minlength="8"
                    autocomplete="new-password" class="input-base">
                <p class="text-xs text-slate-500 dark:text-slate-500 mt-1">At least 8 characters.</p>
            </div>

            <div>
                <label for="new_password_confirm" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5">Confirm new password</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" required minlength="8"
                    autocomplete="new-password" class="input-base">
            </div>

            <button type="submit" class="btn-primary w-full">Set new password</button>
        </form>
    </div>
</div>
{% endblock %}
