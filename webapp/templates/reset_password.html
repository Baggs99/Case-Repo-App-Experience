{% extends "base.html" %}
{% block title %}Set a new password · Case Repo{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-12">
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-6">
        <h1 class="text-xl font-semibold mb-1">Set a new password</h1>
        <p class="text-sm text-slate-600 mb-6">
            Pick a new password for your account. You'll be signed out of every device.
        </p>

        {% if error %}
        <div class="mb-4 px-3 py-2 rounded-md bg-rose-50 border border-rose-200 text-sm text-rose-800">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/reset-password" class="space-y-4">
            <input type="hidden" name="token" value="{{ token }}">

            <div>
                <label for="new_password" class="block text-xs font-medium text-slate-600 mb-1.5">
                    New password
                </label>
                <input type="password" id="new_password" name="new_password" required minlength="8"
                    autocomplete="new-password"
                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-900">
                <p class="text-xs text-slate-500 mt-1">At least 8 characters.</p>
            </div>

            <div>
                <label for="new_password_confirm" class="block text-xs font-medium text-slate-600 mb-1.5">
                    Confirm new password
                </label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" required minlength="8"
                    autocomplete="new-password"
                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-900">
            </div>

            <button type="submit"
                class="w-full px-4 py-2 bg-slate-900 text-white rounded-md hover:bg-slate-800 font-medium">
                Set new password
            </button>
        </form>
    </div>
</div>
{% endblock %}
