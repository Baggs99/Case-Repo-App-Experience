{% extends "base.html" %}
{% block title %}Link invalid · Case Repo{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-14 animate-fade-up">
    <div class="surface rounded-2xl shadow-card p-7 sm:p-8 text-center">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-50 mb-2">Link is invalid or expired</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed">
            Password-reset links expire after 1 hour and can only be used once.
            Request a new link below.
        </p>
        <a href="/forgot-password" class="btn-primary inline-flex">Request a new link</a>
    </div>
</div>
{% endblock %}
