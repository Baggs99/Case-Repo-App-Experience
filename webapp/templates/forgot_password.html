{% extends "base.html" %}
{% block title %}Forgot password · Case Repo{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-12">
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-6">
        <h1 class="text-xl font-semibold mb-1">Forgot your password?</h1>
        <p class="text-sm text-slate-600 mb-6">
            Enter your Yale email and we'll send you a link to choose a new password.
        </p>

        {% if error %}
        <div class="mb-4 px-3 py-2 rounded-md bg-rose-50 border border-rose-200 text-sm text-rose-800">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/forgot-password" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-medium text-slate-600 mb-1.5">Yale email</label>
                <input type="email" id="email" name="email" required
                    value="{{ values.email or '' }}"
                    placeholder="you@yale.edu"
                    autocomplete="email"
                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-900">
            </div>

            <button type="submit"
                class="w-full px-4 py-2 bg-slate-900 text-white rounded-md hover:bg-slate-800 font-medium">
                Send reset link
            </button>
        </form>

        <p class="text-sm text-slate-600 mt-6 text-center">
            Remembered it? <a href="/login" class="text-slate-900 underline">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
